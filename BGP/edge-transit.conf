log syslog all;

router id 172.25.3.1;

protocol kernel kernel1 {
  scan time 20;
  ipv4 {
    export all;
  };
}

protocol device {
  scan time 60;
}

protocol bgp cdn {
  debug all;
  local 172.25.3.1 as 65001;
  #local address 172.25.3.1;
  #router id 172.25.3.1;
  neighbor 172.25.3.2 as 65000;
  direct;
  ipv4 {
    import all;
    export all;
  };
  # next hop self;
}

protocol bgp client_side {
  debug all;
  local 172.25.1.2 as 65001;
  #router id 172.25.3.1;
  #local address 172.25.1.2;
  neighbor 172.25.1.1 as 65002;
  direct;
  ipv4 {
    import all;
    export all;
  };
  #next hop self;
}

